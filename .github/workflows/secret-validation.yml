name: secret-validation

# Fails PRs that introduce plaintext secrets. Runs in ~20 s with no network.

on:
  pull_request:
    branches: [main, remediation/**]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Write gitleaks config
        run: |
          cat > .gitleaks.toml <<'CFG'
          [allowlist]
          description = "Placeholders and documented examples in runbooks"
          regexes = [
            '''<NUEVA_KEY_ROTADA>''',
            '''REEMPLAZAR''',
            '''<APP_ID>''',
            '''<APP_SECRET>''',
            '''<KEY>''',
            '''sk-proj-HnlO''',
          ]
          paths = [
            '''.*\.md$''',
            '''docs/audit/.*''',
            '''docs/runbooks/.*''',
          ]
          CFG

      - name: Run gitleaks (commits on this PR)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Run gitleaks (push / manual)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Required GitHub Secrets present
        if: github.event_name == 'workflow_dispatch'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          missing=()
          [[ -z "$VPS_SSH_KEY" ]] && missing+=(VPS_SSH_KEY)
          [[ -z "$VPS_HOST"    ]] && missing+=(VPS_HOST)
          [[ -z "$VPS_USER"    ]] && missing+=(VPS_USER)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets configured."
