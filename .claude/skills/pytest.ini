[pytest]
minversion = 7.0
testpaths =
    device-audit/tests
    stream-health/tests
    imou-refresh/tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    integration: marks tests as integration (may spawn subprocesses)
    vps: marks tests that need a live VPS connection (skip by default)
